name: musical
description: Field's take on Logic Pro's Musical Typing. White keys on the home row, black keys above, the arrows choose and turn knobs, and the number row types a knob's value.
base: 60
glide: 1
notes:
  KeyA: 0
  KeyW: 1
  KeyS: 2
  KeyE: 3
  KeyD: 4
  KeyF: 5
  KeyT: 6
  KeyG: 7
  KeyY: 8
  KeyH: 9
  KeyU: 10
  KeyJ: 11
  KeyK: 12
  KeyO: 13
  KeyL: 14
  KeyP: 15
  Semicolon: 16
  Quote: 17
  BracketRight: 18
controls:
  KeyZ: { transpose: -12 }
  KeyX: { transpose: 12 }
  KeyC: { velocity: -20 }
  KeyV: { velocity: 20 }
  Comma: { bend: -1 }
  Period: { bend: 1 }
  Tab: { cc: 64, value: 127, mode: hold }
  ArrowLeft: { knob: -1 }
  ArrowRight: { knob: 1 }
  ArrowUp: { turn: 1 }
  ArrowDown: { turn: -1 }
  Digit1: { type: 1 }
  Digit2: { type: 2 }
  Digit3: { type: 3 }
  Digit4: { type: 4 }
  Digit5: { type: 5 }
  Digit6: { type: 6 }
  Digit7: { type: 7 }
  Digit8: { type: 8 }
  Digit9: { type: 9 }
  Digit0: { type: 0 }
  Minus: { type: "-" }
