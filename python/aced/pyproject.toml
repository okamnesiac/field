# bloom-aced — the ACE generation worker (ace-generation.md §3). A uv
# project with its own pinned environment; set up explicitly via
# `bloom ace setup`, never automatically. ACE-Step 1.5 is pinned by
# commit; bump deliberately.
[project]
name = "bloom-aced"
version = "0.1.0"
description = "Bloom's ACE-Step generation worker: NDJSON over a unix socket"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ace-step @ git+https://github.com/ace-step/ACE-Step-1.5.git@6d467e4b5081ccb0abf1ec1bf4fdf9051a2d34b0",
]

[project.scripts]
bloom-aced = "bloom_aced.main:main"

[dependency-groups]
dev = ["pyright==1.1.411"]

[tool.pyright]
# Strict everywhere we write; the ACE-Step boundary is quarantined in
# adapter.py (ace-generation.md §3.4).
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true # the ACE-Step pin is a git reference

[tool.hatch.build.targets.wheel]
packages = ["src/bloom_aced"]
