name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two jobs, split by what a test needs rather than by platform loyalty
# (linux-portability.md decision 4). The Linux job is the fast gate and
# runs everything that does not shell out to a macOS binary — including
# the daemon, which builds on both platforms since chunk 4. The macOS job
# covers the nine tests that need a macOS binary, and is where the product
# platform gets its full run. Both run `pnpm test` — #46's stopgap dropped
# it entirely, and green meaning "the tests ran" is the whole point.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # JUCE's build helper `juceaide` links juce_gui_basics whatever the
      # app links, so a headless console daemon still needs the X and
      # freetype headers. This list is what an ubuntu:24.04 container
      # actually needed, not a guess; `build-essential`, `cmake` and
      # `pkg-config` are already on the runner.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libglu1-mesa-dev
      - uses: actions/cache@v4
        with:
          path: native/audiod/build
          key: audiod-${{ runner.os }}-${{ hashFiles('native/audiod/CMakeLists.txt') }}
      - run: pnpm build:native
      # Before `pnpm test`, not after: src/workers/lockfile.test.ts asks
      # real uv how `--locked` differs from `--frozen`, and skips without
      # it. With setup-uv below the tests, that skip was unconditional in
      # CI and the test only ever ran on the author's machine.
      - uses: astral-sh/setup-uv@v5
      # Nine tests skip here — `say` (6) and `afconvert` (3) — on the
      # capability probes in src/testing/platform.ts, not by excluding
      # their files. Those four files hold 72 tests between them, and the
      # other 63 are the graph, stem and DSP code this job exists to
      # exercise. The daemon's protocol tests are no longer among the
      # skips: they run here too, in null-output mode.
      - run: pnpm test
      # Python workers: pyright strict is the gate (ace-generation.md §3.4).
      # Only the dev group installs — the model environment (torch, mlx)
      # is far too heavy for CI — so production dependencies are absent
      # and `field_worker` is resolved by `extraPaths` rather than by
      # install (#59 review: adding it as a real dependency broke this
      # step, because --only-group excludes every production dependency).
      #
      # Both packages are checked. field-worker declares strict typing and
      # nothing enforced it when it was added, which is a gate that exists
      # only in its own pyproject (#59 review). It has no production
      # dependencies at all, so its sync is trivial.
      - run: cd python/worker && uv sync --only-group dev && uv run --no-sync pyright src
      - run: cd python/aced && uv sync --only-group dev && uv run --no-sync pyright src
      - run: cd python/voiced && uv sync --only-group dev && uv run --no-sync pyright src

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The native daemon: cached on the CMakeLists hash so a JUCE recompile
      # only happens when the pin or the build itself changes. The daemon
      # protocol tests in pnpm test find the built binary and run against it
      # in null-output mode (no audio device on runners).
      - uses: actions/cache@v4
        with:
          path: native/audiod/build
          key: audiod-${{ runner.os }}-${{ hashFiles('native/audiod/CMakeLists.txt') }}
      - run: pnpm build:native
      # uv for src/workers/lockfile.test.ts, which asks real uv about
      # `--locked` and skips without it. This lane runs the whole suite,
      # so it needs everything the whole suite needs.
      - uses: astral-sh/setup-uv@v5
      # The whole suite, not the nine alone. macOS is the product platform
      # (overview.md "V1 platform scope"), so it is the wrong one to give
      # partial coverage — and the suite measures ~13s against a job
      # dominated by install and the native build, so narrowing it would
      # save seconds and cost a file list that silently drifts.
      - run: pnpm test
