name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job, on Linux. The macOS job is gone for cost: the 3,000 included
# minutes are only 300 macOS minutes at the 10x rate, and it was spending
# them to run a test set identical to this one — `say` and `afconvert`
# retired in render-pipeline.md chunk 5 and took the last platform-bound
# cases with them, so nothing in the suite needs a macOS binary.
#
# What that gives up, stated plainly (linux-portability.md decision 4,
# amended 2026-08-08): nobody compiles native/audiod against CoreAudio in
# CI any more, so a break in a JUCE_MAC branch reaches main unnoticed.
# There are six, in two files — the property listeners in player.cpp and
# two declarations in player.h, one of which is
# `hardwareListenersAvailable`, a platform-varying constant other code
# branches on, so a break there can change behaviour rather than merely
# fail to compile. The cover is that development happens on macOS, so
# `pnpm build:native` locally is the real gate. That is a weaker
# guarantee than a runner and it is the trade being made.
#
# `pnpm test` runs here — #46's stopgap dropped it entirely, and green
# meaning "the tests ran" is the whole point.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # The example project, checked by the CLI that was just built. This
      # is the reason bloom moved into the tree (bloom-in-tree.md §1): the
      # format's only real consumer used to live in another repository,
      # where a schema change could not break it until somebody opened it
      # by hand — which is how a flag day half-landed, a second song went
      # unmigrated, and a retired field sat accepted and unread.
      #
      # `node dist/cli.js` rather than a linked `field`, so what runs is
      # the artifact `pnpm build` produced. `check` only: `build` would
      # need sclang, which the runner does not have, and creek's takes are
      # generated rather than committed so they are absent here by design.
      - run: cd examples/bloom && node ../../dist/cli.js check
      # JUCE's build helper `juceaide` links juce_gui_basics whatever the
      # app links, so a headless console daemon still needs the X and
      # freetype headers. This list is what an ubuntu:24.04 container
      # actually needed, not a guess; `build-essential`, `cmake` and
      # `pkg-config` are already on the runner.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libglu1-mesa-dev
      - uses: actions/cache@v4
        with:
          path: native/audiod/build
          key: audiod-${{ runner.os }}-${{ hashFiles('native/audiod/CMakeLists.txt') }}
      - run: pnpm build:native
      # Before `pnpm test`, not after: src/workers/lockfile.test.ts asks
      # real uv how `--locked` differs from `--frozen`, and skips without
      # it. With setup-uv below the tests, that skip was unconditional in
      # CI and the test only ever ran on the author's machine.
      - uses: astral-sh/setup-uv@v5
      # One test skips here: the sclang integration case in
      # src/graph/build.test.ts, on a `!sclangPresent` probe rather than
      # by excluding its file. Not the nine that linux-portability.md
      # decision 4 describes — `say` and `afconvert` both retired in
      # render-pipeline.md §6 chunk 5 and took their guards with them, so
      # nothing in the suite shells out to a macOS binary any more. Nor
      # is that one skip a Linux limit: sclang runs on Linux, it just is
      # not installed on the runner, and it skipped on macOS for the same
      # reason back when there was a macOS runner to skip on. The
      # daemon's protocol tests run here, in null-output mode.
      - run: pnpm test
      # Python workers: pyright strict is the gate (ace-generation.md §3.4).
      # Only the dev group installs — the model environment (torch, mlx)
      # is far too heavy for CI — so production dependencies are absent
      # and `field_worker` is resolved by `extraPaths` rather than by
      # install (#59 review: adding it as a real dependency broke this
      # step, because --only-group excludes every production dependency).
      #
      # Both packages are checked. field-worker declares strict typing and
      # nothing enforced it when it was added, which is a gate that exists
      # only in its own pyproject (#59 review). It has no production
      # dependencies at all, so its sync is trivial.
      - run: cd python/worker && uv sync --only-group dev && uv run --no-sync pyright src
      - run: cd python/aced && uv sync --only-group dev && uv run --no-sync pyright src
      - run: cd python/voiced && uv sync --only-group dev && uv run --no-sync pyright src


  # Windows is a build-and-test-and-play target (windows-portability.md),
  # and this job is what keeps the port from rotting: the same typecheck,
  # build, example check, native build and suite as Linux. The Python
  # pyright gates stay Linux-only — the workers keep their POSIX
  # transport until their own chunk (§4), so gating them here would test
  # a combination nothing supports. The JUCE FetchContent build is the
  # expensive step; the cache key matches the Linux job's shape and adds
  # the OS, since MSVC objects and ELF objects share nothing.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: cd examples/bloom && node ../../dist/cli.js check
      - uses: actions/cache@v4
        with:
          path: native/audiod/build
          key: audiod-${{ runner.os }}-${{ hashFiles('native/audiod/CMakeLists.txt') }}
      - run: pnpm build:native
      - run: pnpm test
