# The generated line at the project rate. Chatterbox emits 24 kHz mono
# float, which is no project's rate — so the wrapper is not a formality,
# it is where the take enters the song's grid (voice-generation.md §7,
# whose "still unproven" paragraph this file is what discharges).
# The clips source this, not lead-take: choosing a different take moves
# what lead-take means and this follows, which is the whole point of the
# sound-plus-normalize pair rather than a clip pointing at a variant.
name: vocal-48k
type: normalize
source: lead-take
sample_rate: 48000
bit_depth: 24
