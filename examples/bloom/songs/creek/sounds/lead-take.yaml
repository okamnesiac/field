# the lead vocal, as a request rather than a record: no takes ship with
# this example (bloom-in-tree.md §2.4), so the first thing creek asks of
# you is your own voice for it.
#
#   field generate lead-take --song creek --seed 4823 --variants 3
#
# That fills `variants:` below and chooses the first. `field choose
# lead-take --song creek --variant 2` moves which one the sound means;
# every clip follows, because clips reference the sound and not a file.
name: lead-take
type: generative
text: I walked the fence line in the tall grass, down to the creek
# how the line is delivered: calm and unhurried, both well under the
# model's defaults (voice-generation.md §8)
exaggeration: 0.3
conviction: 0.3
variants: []
