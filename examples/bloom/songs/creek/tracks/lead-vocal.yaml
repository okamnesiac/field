name: lead-vocal
inserts:
  # a two-effect chain, in series: bury the generated line, then set it
  # in a room. The low-pass loses level by cutting highs, and the EQ's
  # auto-normalize gives it back — tone changes, level doesn't.
  #
  # 700 Hz, raised from the 400 that f483957 chose for the `say` scratch:
  # the generated voice sat too far under at that corner. What the move
  # buys is low-mids, not words. Measured against the dry sound as the
  # share of each band's energy that survives the chain: 400-700 keeps
  # 67%, 700-2k keeps 15%, and 2-8 kHz keeps 0.41% — 244 times down, so
  # the consonants are still gone. Intelligibility would mean 2-3 kHz and
  # a different idea of what this part is.
  #
  # One basis for all three, which the first version of this comment did
  # not have: it quoted two retention ratios and then the band's share of
  # the stem spectrum (0.004%), which is a different quantity and reads
  # as though a hundred times less energy survived than does.
  - effect: eq
    bands:
      - type: lowpass
        frequency: 700
  - effect: reverb
    mix: 0.3
    decay: 1.8
    predelay_ms: 40 # dry ahead of the wash; at 700 Hz that is body, not
    # consonants — there are none left to place
    damping: 0.7
sends:
  # the voice joins the same room as the keys (tracks/space.yaml) —
  # post, so the room hears the buried, already-set line rather than
  # the raw consonants the chain above deliberately loses
  vocal-verb:
    gain_db: -10
inputs:
  # The generated line, placed from its own leaf track — the one place
  # the request is written (tracks/lead-take.yaml). Chatterbox emits
  # 24 kHz mono, which is no project's rate; the leaf's own edge
  # converts it to the song's 48 kHz automatically (multi-rate.md
  # decisions 4 and 6). Choosing a different take still moves both
  # placements at once, because they place the track, not a variant.
  #
  # No fade_out on either clip. The window is eight beats (5.00 s) and the
  # take is 3.12 s, so a tail fade would shape most of two seconds of
  # silence rather than the line's ending. The take needs no guard
  # anyway: it ends at effectively zero (last 0.1 s peaks at 0.0074,
  # final sample 0.000002), which a generated line does and a recorded
  # one would not — so re-add one if a real vocal ever replaces this.
  - id: verse-vocal-w8n2d
    track: lead-take
    at: [5] # where the verse starts
    duration: [0, 8] # eight beats — room for any take, not just this one
    fade_in: 4800 # 0.1 s, softens the entrance
  # the same line again over the stripped-back third pass — just vocals
  # and keys from bar 9
  - id: build-vocal-x9k4t
    track: lead-take
    at: [9]
    duration: [0, 8]
    fade_in: 4800
