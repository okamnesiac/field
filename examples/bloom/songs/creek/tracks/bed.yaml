# an explicit subset: the instrumental bed without the vocal. Same three
# passes main makes, minus the one placement that carries the voice —
# which is the argument for placements being the unit. Before nesting,
# this file re-listed every instrument and drifted from main whenever one
# of them moved.
name: bed
inputs:
  - track: phrase
    at: [1]
  - track: phrase
    at: [5]
  - track: phrase
    at: [9]
  - track: pad
    at: 0
    gain_db: -6 # the bed sits under both the vocal and the beat
    pan: -0.2 # a touch left, opposite the vocal
