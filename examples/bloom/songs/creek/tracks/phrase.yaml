# the repeating unit: four bars of band, placed three times by main.
# creek is "three passes of the keys phrase" — that sentence was in
# song.yaml long before the model could say it, and this is it said
# structurally rather than by three tracks each twelve bars long.
#
# What is NOT in here is as deliberate as what is. The pad crosses a
# phrase boundary (its second clip enters a beat before bar 5) and the
# vocal only sings over passes two and three, so both stay at the root
# where they can span or skip passes. A phrase is what repeats exactly.
name: phrase
inputs:
  - track: drums
    at: 0
  - track: keys
    at: 0
    gain_db: -4 # scratch level while auditioning variants
    pan: 0.2 # a touch right, opposite the pad
