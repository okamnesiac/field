# bass's knobs (Field's docs/keys.md, "Knob files"): field keys shows
# them and sends each as its controller, and bass.scd's voice maps each
# controller through the range here. The numbers are General MIDI 2's
# sound controllers, so a controller set up for General MIDI turns them
# too.
knobs:
  - { name: cutoff, cc: 74, min: 50, max: 15000, curve: exp, units: Hz, default: 1200 }
  - { name: res, cc: 71, min: 0, max: 0.95, curve: lin, default: 0.4 }
  - { name: attack, cc: 73, min: 0.005, max: 4, curve: exp, units: s, default: 0.005 }
  - { name: release, cc: 72, min: 0.02, max: 8, curve: exp, units: s, default: 0.15 }
